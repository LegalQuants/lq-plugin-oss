name: Setup Python
description: uv, pinned CPython, frozen dev-group sync

inputs:
  python-version:
    description: CPython version for this job
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install Python tooling
      shell: bash
      run: uv sync --frozen --group dev
